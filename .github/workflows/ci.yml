name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # 直近の実行は 1〜1.5 分ほど。止まったときに長く待たないよう 5 分で打ち切る
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # AI の Container（container/）の型チェック。Cursor SDK はこちらにだけ入れる
      - run: npm ci --prefix container
      - run: npx tsc -p container
      - run: npm test
      - run: npm run build
